name: Daily Energy Report Scraper

on:
  schedule:
    # Runs every day at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Required for git push (data.json)
  issues: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          # This pulls the variable you just created in GitHub Settings
          SCRAPER_PROXY_URL: ${{ vars.SCRAPER_PROXY_URL }}
          SCRAPER_DEBUG: "0"
        run: python scraper.py

      - name: Sync data.json to Dashboard folder
        run: |
          if [ -d "dashboard" ]; then
            cp data.json dashboard/data.json
          fi

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update daily energy metrics [skip ci]" && git push)


      - name: Create GitHub Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: ' Daily Scraper Failed',
              body: `The automated daily energy report scraper failed on run [#${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nPlease check the build log to investigate the issue.`
            })